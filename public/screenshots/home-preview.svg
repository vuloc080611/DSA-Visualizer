<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 800; fill: #ffffff; }
    .sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; fill: #94a3b8; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>

  <!-- Browser Window Frame -->
  <rect width="1200" height="675" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="2"/>
  
  <!-- Window Header / Title Bar -->
  <rect width="1200" height="42" rx="16" fill="#0f172a"/>
  <rect y="26" width="1200" height="16" fill="#0f172a"/>
  <line x1="0" y1="42" x2="1200" y2="42" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Window Dots -->
  <circle cx="24" cy="21" r="6" fill="#ef4444"/>
  <circle cx="44" cy="21" r="6" fill="#f59e0b"/>
  <circle cx="64" cy="21" r="6" fill="#10b981"/>

  <!-- Address Bar -->
  <rect x="300" y="9" width="600" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="600" y="25" text-anchor="middle" font-size="11" fill="#94a3b8" class="mono">https://dsa-visualizer-one-beta.vercel.app</text>

  <!-- Background Decorative Glow -->
  <circle cx="600" cy="240" r="160" fill="#10b981" opacity="0.12" filter="url(#glow)"/>
  <circle cx="850" cy="280" r="140" fill="#06b6d4" opacity="0.08" filter="url(#glow)"/>

  <!-- Navbar -->
  <rect x="0" y="42" width="1200" height="60" fill="#090d16" opacity="0.8"/>
  <line x1="0" y1="102" x2="1200" y2="102" stroke="#1e293b" stroke-width="1"/>

  <!-- Navbar Logo -->
  <rect x="40" y="54" width="36" height="36" rx="8" fill="url(#btnGrad)"/>
  <text x="58" y="77" text-anchor="middle" font-size="16" fill="#ffffff" font-weight="bold" class="mono">&lt;/&gt;</text>
  <text x="88" y="74" font-size="18" font-weight="bold" fill="#ffffff" class="title">DSA <tspan fill="#10b981">Visualizer</tspan></text>
  <rect x="220" y="62" width="68" height="20" rx="4" fill="#064e3b" stroke="#047857" stroke-width="1"/>
  <text x="254" y="76" text-anchor="middle" font-size="10" font-weight="bold" fill="#34d399" class="mono">NEXT.JS 15</text>

  <!-- Navbar Links -->
  <rect x="420" y="56" width="76" height="32" rx="8" fill="#1e293b"/>
  <text x="458" y="77" text-anchor="middle" font-size="13" font-weight="600" fill="#10b981" class="title">Sorting</text>
  
  <text x="540" y="77" text-anchor="middle" font-size="13" font-weight="600" fill="#94a3b8" class="title">Searching</text>
  <text x="630" y="77" text-anchor="middle" font-size="13" font-weight="600" fill="#94a3b8" class="title">Graph</text>
  <text x="730" y="77" text-anchor="middle" font-size="13" font-weight="600" fill="#94a3b8" class="title">Array &amp; Window</text>

  <!-- Navbar Right items -->
  <rect x="940" y="56" width="130" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="960" y="76" font-size="12" fill="#94a3b8" class="title">Tìm nhanh...</text>
  <rect x="1035" y="62" width="26" height="20" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="1048" y="76" text-anchor="middle" font-size="10" fill="#94a3b8" class="mono">⌘K</text>

  <rect x="1085" y="56" width="34" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <circle cx="1102" cy="72" r="6" fill="none" stroke="#f59e0b" stroke-width="2"/>

  <!-- HERO SECTION -->
  <!-- Badge -->
  <rect x="450" y="130" width="300" height="28" rx="14" fill="#064e3b" stroke="#059669" stroke-width="1"/>
  <text x="600" y="148" text-anchor="middle" font-size="11" font-weight="600" fill="#6ee7b7" class="title">✦ Interactive Algorithm Visualization Web App</text>

  <!-- Main Headline -->
  <text x="600" y="200" text-anchor="middle" font-size="34" font-weight="800" fill="#ffffff" class="title">
    Hiểu Rõ Bản Chất Giải Thuật Bằng <tspan fill="url(#textGrad)">Hình Ảnh Tương Tác</tspan>
  </text>
  <text x="600" y="235" text-anchor="middle" class="sub">
    Học và ôn tập 13 thuật toán kinh điển từ Sorting, Searching đến Graph &amp; Dynamic Programming với animation 60 FPS mượt mà.
  </text>

  <!-- CTA Buttons -->
  <rect x="450" y="260" width="150" height="40" rx="10" fill="url(#btnGrad)"/>
  <text x="525" y="285" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff" class="title">Khám phá giải thuật →</text>
  
  <rect x="615" y="260" width="140" height="40" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="685" y="285" text-anchor="middle" font-size="13" font-weight="bold" fill="#e2e8f0" class="title">Xem Demo Bubble Sort</text>

  <!-- CARDS GALLERY GRID -->
  <!-- Card 1: Quick Sort -->
  <g transform="translate(60, 330)">
    <rect width="255" height="300" rx="16" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.5"/>
    <rect x="16" y="16" width="70" height="22" rx="6" fill="#064e3b"/>
    <text x="51" y="31" text-anchor="middle" font-size="10" font-weight="bold" fill="#34d399" class="mono">SORTING</text>
    <text x="16" y="68" font-size="18" font-weight="bold" fill="#ffffff" class="title">Quick Sort</text>
    <text x="16" y="95" font-size="12" fill="#94a3b8" class="title" width="220">Phân hoạch quanh phần tử Pivot, chia để trị cực nhanh.</text>
    
    <!-- Complexity Badges -->
    <rect x="16" y="145" width="68" height="24" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="50" y="161" text-anchor="middle" font-size="10" fill="#f59e0b" class="mono">O(N log N)</text>

    <rect x="90" y="145" width="60" height="24" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="120" y="161" text-anchor="middle" font-size="10" fill="#ec4899" class="mono">O(N²)</text>

    <!-- Mini Visualizer Bars inside card -->
    <rect x="20" y="205" width="18" height="35" rx="3" fill="#334155"/>
    <rect x="44" y="190" width="18" height="50" rx="3" fill="#334155"/>
    <rect x="68" y="180" width="18" height="60" rx="3" fill="#f59e0b"/>
    <rect x="92" y="165" width="18" height="75" rx="3" fill="#10b981"/>
    <rect x="116" y="150" width="18" height="90" rx="3" fill="#8b5cf6"/>
    <rect x="140" y="175" width="18" height="65" rx="3" fill="#ef4444"/>
    <rect x="164" y="200" width="18" height="40" rx="3" fill="#334155"/>

    <rect x="16" y="250" width="223" height="34" rx="8" fill="url(#btnGrad)"/>
    <text x="127" y="272" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff" class="title">Trực quan hóa ngay →</text>
  </g>

  <!-- Card 2: Binary Search -->
  <g transform="translate(340, 330)">
    <rect width="255" height="300" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
    <rect x="16" y="16" width="76" height="22" rx="6" fill="#1e3a8a"/>
    <text x="54" y="31" text-anchor="middle" font-size="10" font-weight="bold" fill="#60a5fa" class="mono">SEARCHING</text>
    <text x="16" y="68" font-size="18" font-weight="bold" fill="#ffffff" class="title">Binary Search</text>
    <text x="16" y="95" font-size="12" fill="#94a3b8" class="title">Chia đôi không gian tìm kiếm, độ phức tạp logarit O(log N).</text>
    
    <rect x="16" y="145" width="68" height="24" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="50" y="161" text-anchor="middle" font-size="10" fill="#34d399" class="mono">O(log N)</text>

    <!-- Mini Binary Search visualization -->
    <rect x="20" y="210" width="24" height="30" rx="3" fill="#334155" opacity="0.4"/>
    <rect x="50" y="200" width="24" height="40" rx="3" fill="#334155" opacity="0.4"/>
    <rect x="80" y="185" width="24" height="55" rx="3" fill="#8b5cf6"/>
    <text x="92" y="175" text-anchor="middle" font-size="9" fill="#c084fc" class="mono">MID</text>
    <rect x="110" y="170" width="24" height="70" rx="3" fill="#10b981"/>
    <rect x="140" y="160" width="24" height="80" rx="3" fill="#06b6d4"/>

    <rect x="16" y="250" width="223" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="127" y="272" text-anchor="middle" font-size="12" font-weight="bold" fill="#e2e8f0" class="title">Trực quan hóa ngay →</text>
  </g>

  <!-- Card 3: BFS Graph -->
  <g transform="translate(620, 330)">
    <rect width="255" height="300" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
    <rect x="16" y="16" width="56" height="22" rx="6" fill="#581c87"/>
    <text x="44" y="31" text-anchor="middle" font-size="10" font-weight="bold" fill="#c084fc" class="mono">GRAPH</text>
    <text x="16" y="68" font-size="18" font-weight="bold" fill="#ffffff" class="title">Breadth-First (BFS)</text>
    <text x="16" y="95" font-size="12" fill="#94a3b8" class="title">Duyệt đồ thị theo từng tầng sử dụng hàng đợi (Queue).</text>
    
    <rect x="16" y="145" width="68" height="24" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="50" y="161" text-anchor="middle" font-size="10" fill="#c084fc" class="mono">O(V + E)</text>

    <!-- Mini Graph Nodes -->
    <line x1="127" y1="175" x2="80" y2="215" stroke="#10b981" stroke-width="2"/>
    <line x1="127" y1="175" x2="175" y2="215" stroke="#10b981" stroke-width="2"/>
    <circle cx="127" cy="175" r="14" fill="#8b5cf6" stroke="#c084fc" stroke-width="2"/>
    <text x="127" y="179" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold" class="mono">A</text>
    <circle cx="80" cy="215" r="14" fill="#10b981" stroke="#34d399" stroke-width="2"/>
    <text x="80" y="219" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold" class="mono">B</text>
    <circle cx="175" cy="215" r="14" fill="#f59e0b" stroke="#fbbf24" stroke-width="2"/>
    <text x="175" y="219" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold" class="mono">C</text>

    <rect x="16" y="250" width="223" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="127" y="272" text-anchor="middle" font-size="12" font-weight="bold" fill="#e2e8f0" class="title">Trực quan hóa ngay →</text>
  </g>

  <!-- Card 4: Two Sum -->
  <g transform="translate(900, 330)">
    <rect width="240" height="300" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
    <rect x="16" y="16" width="56" height="22" rx="6" fill="#78350f"/>
    <text x="44" y="31" text-anchor="middle" font-size="10" font-weight="bold" fill="#fcd34d" class="mono">ARRAY</text>
    <text x="16" y="68" font-size="18" font-weight="bold" fill="#ffffff" class="title">Two Sum</text>
    <text x="16" y="95" font-size="12" fill="#94a3b8" class="title">Bảng băm Hash Map tối ưu hóa bài toán kinh điển.</text>
    
    <rect x="16" y="145" width="50" height="24" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="41" y="161" text-anchor="middle" font-size="10" fill="#34d399" class="mono">O(N)</text>

    <!-- Mini Hash Map Representation -->
    <rect x="20" y="185" width="200" height="45" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="30" y="205" font-size="10" fill="#94a3b8" class="mono">Target = 26</text>
    <text x="30" y="222" font-size="10" fill="#34d399" class="mono">Found: 11 + 15 = 26 ✓</text>

    <rect x="16" y="250" width="208" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="120" y="272" text-anchor="middle" font-size="12" font-weight="bold" fill="#e2e8f0" class="title">Trực quan hóa ngay →</text>
  </g>
</svg>
